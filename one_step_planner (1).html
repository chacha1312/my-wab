<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 — 나만의 할 일 플래너</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#758099;--line:#e7ebf3;--accent:#635bff;--accent2:#8b5cf6;--green:#16a085;--shadow:0 18px 50px rgba(31,42,68,.08)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0%,#ecebff 0,transparent 30%),var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c7c4ff;outline-offset:2px}
.app{max-width:1180px;margin:auto;padding:28px 22px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:23px;box-shadow:0 8px 18px #635bff45}.brand h1{font-size:22px;margin:0;letter-spacing:-.7px}.brand p{margin:1px 0 0;color:var(--muted);font-size:13px}.date-pill{border:1px solid var(--line);background:#ffffffb8;padding:10px 14px;border-radius:14px;color:#58617a;font-weight:650}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;margin-bottom:20px}.welcome,.score{border-radius:24px;padding:26px;background:var(--card);box-shadow:var(--shadow);border:1px solid #ffffff}.welcome{background:linear-gradient(115deg,#24234a,#4d48a7);color:#fff;position:relative;overflow:hidden}.welcome:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff12;right:-50px;top:-90px}.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:11px;font-weight:800;color:#c7c5ff}.welcome h2{font-size:clamp(24px,3vw,34px);line-height:1.2;margin:10px 0 8px;letter-spacing:-1px;position:relative;z-index:1}.welcome p{color:#dfdefc;margin:0;max-width:520px}.score{display:flex;align-items:center;gap:20px}.ring{width:104px;height:104px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--progress,0%),#eef0f7 0);position:relative}.ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}.ring strong{position:relative;font-size:23px}.score-copy h3{margin:0 0 5px;font-size:16px}.score-copy p{margin:0;color:var(--muted);font-size:13px}.mini-stats{display:flex;gap:14px;margin-top:13px}.mini-stats span{font-size:12px;color:var(--muted)}.mini-stats b{color:var(--ink);font-size:15px;margin-right:4px}
.layout{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}.panel{background:var(--card);border:1px solid #fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.panel h3{font-size:17px;margin:0 0 18px;letter-spacing:-.3px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:750;color:#65708a}.field input,.field select{width:100%;border:1px solid var(--line);background:#fbfcff;border-radius:12px;padding:12px 13px;color:var(--ink);min-width:0}.field input::placeholder{color:#a4adbf}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border-radius:12px;padding:12px 16px;font-weight:750;box-shadow:0 7px 16px #635bff30}.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}.secondary{border:1px solid var(--line);background:#fff;color:#59637b;border-radius:11px;padding:9px 12px;font-weight:650}.hint{font-size:12px;color:var(--muted);margin:12px 0 0}.right{min-width:0}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.list-head h3{margin:0}.toolbar{display:flex;gap:8px;align-items:center}.search{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;width:min(230px,38vw)}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 13px}.tab{white-space:nowrap;border:1px solid transparent;border-radius:10px;background:#f3f5fa;color:#737d94;padding:8px 12px;font-size:12px;font-weight:750}.tab.active{background:#eeedff;color:var(--accent);border-color:#dcd9ff}.task-list{display:flex;flex-direction:column;gap:10px}.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff;transition:.18s}.task:hover{border-color:#d5d2ff;box-shadow:0 8px 22px #313a5510}.check{appearance:none;width:21px;height:21px;border:1.8px solid #c8cede;border-radius:7px;margin:2px 0 0;display:grid;place-items:center;cursor:pointer}.check:checked{background:var(--accent);border-color:var(--accent)}.check:checked:after{content:"✓";color:#fff;font-size:14px;font-weight:900}.task-title{font-weight:700;overflow-wrap:anywhere}.task.done .task-title{color:#a0a8b8;text-decoration:line-through}.task-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}.tag{font-size:11px;font-weight:750;padding:4px 8px;border-radius:8px;background:#f1f2f8;color:#68728b}.tag.work{background:#e9efff;color:#4059c7}.tag.study{background:#f1eaff;color:#8053c5}.tag.personal{background:#e5f8f2;color:#168568}.tag.health{background:#fff0e6;color:#c56b32}.tag.urgent{background:#fff0f0;color:#d44d58}.due{font-size:11px;color:#818ba0}.due.late{color:#d44d58;font-weight:800}.task-actions{display:flex;gap:4px}.icon-btn{border:0;background:transparent;color:#a0a8b8;padding:4px 6px;border-radius:7px}.icon-btn:hover{background:#f5f5fb;color:var(--accent)}.empty{padding:48px 15px;text-align:center;border:1px dashed #dfe3ed;border-radius:16px;color:var(--muted)}.empty .emoji{font-size:32px;margin-bottom:8px}.empty strong{display:block;color:#59637b;margin-bottom:3px}.bottomline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px;color:var(--muted);font-size:12px}.bottomline button{font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#20233b;color:white;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;background:#10152c66;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(440px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 30px 90px #12162c40}.modal h3{margin:0 0 8px}.modal p{color:var(--muted);font-size:13px;margin:0 0 16px}.modal textarea{width:100%;resize:vertical;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
@media(max-width:800px){.app{padding:18px 13px 35px}.hero{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.welcome,.score{padding:22px}.panel{padding:18px}.topbar{align-items:flex-start}.date-pill{font-size:12px;padding:8px 10px}.list-head{align-items:flex-start;flex-direction:column}.toolbar{width:100%}.search{width:100%;flex:1}}
@media(max-width:420px){.brand h1{font-size:19px}.date-pill{max-width:130px;text-align:center}.two{grid-template-columns:1fr 1fr}.task{gap:9px;padding:12px}.task-actions{flex-direction:column}.score{gap:14px}.ring{width:88px;height:88px}.ring strong{font-size:20px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">✓</div><div><h1>오늘, 한 걸음</h1><p>작은 완료가 큰 변화를 만들어요.</p></div></div>
    <div class="date-pill" id="todayDate">오늘 날짜</div>
  </header>
  <section class="hero">
    <div class="welcome"><div class="eyebrow">YOUR DAILY SPACE</div><h2>오늘도 나답게,<br>하나씩 해내기.</h2><p id="greeting">해야 할 일을 정리하고, 중요한 일부터 시작해 봐요.</p></div>
    <div class="score"><div class="ring" id="ring"><strong id="percent">0%</strong></div><div class="score-copy"><h3>오늘의 달성률</h3><p id="scoreText">첫 번째 할 일을 추가해 보세요.</p><div class="mini-stats"><span><b id="doneCount">0</b>완료</span><span><b id="leftCount">0</b>남음</span></div></div></div>
  </section>
  <main class="layout">
    <aside class="panel">
      <h3 id="formTitle">＋ 새 할 일 추가</h3>
      <form id="taskForm">
        <div class="field"><label for="taskInput">무엇을 할까요?</label><input id="taskInput" maxlength="180" placeholder="예: 과학 숙제 마무리하기" required></div>
        <div class="two">
          <div class="field"><label for="category">카테고리</label><select id="category"><option value="study">📚 공부</option><option value="work">💼 업무</option><option value="personal">🏡 개인</option><option value="health">🌿 건강</option><option value="etc">✨ 기타</option></select></div>
          <div class="field"><label for="priority">우선순위</label><select id="priority"><option value="normal">보통</option><option value="high">높음</option><option value="low">낮음</option></select></div>
        </div>
        <div class="field"><label for="dueDate">마감일 (선택)</label><input type="date" id="dueDate"></div>
        <button class="primary" style="width:100%" id="submitBtn" type="submit">할 일 추가하기 <span>→</span></button>
        <button class="secondary" style="width:100%;margin-top:8px;display:none" id="cancelEdit" type="button">수정 취소</button>
      </form>
      <p class="hint">💡 큰 일은 작게 나누면 시작하기 쉬워져요.</p>
    </aside>
    <section class="panel right">
      <div class="list-head"><h3>내 할 일 <span id="listCount" style="color:#9aa2b4;font-size:14px">0</span></h3><div class="toolbar"><input class="search" id="searchInput" placeholder="🔎 할 일 검색" aria-label="할 일 검색"><button class="secondary" id="sortBtn" type="button">우선순위순 ↕</button></div></div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="all">전체</button><button class="tab" data-filter="active">진행 중</button><button class="tab" data-filter="done">완료</button><button class="tab" data-filter="study">📚 공부</button><button class="tab" data-filter="work">💼 업무</button><button class="tab" data-filter="personal">🏡 개인</button><button class="tab" data-filter="health">🌿 건강</button><button class="tab" data-filter="etc">✨ 기타</button>
      </div>
      <div class="task-list" id="taskList"></div>
      <div class="bottomline"><span id="footerCount">할 일을 추가하면 여기에 표시돼요.</span><button class="secondary" id="clearDone" type="button">완료 항목 정리</button></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><div class="modal"><h3 id="helpTitle">✨ 오늘의 작은 코치</h3><p id="helpIntro">현재 할 일에 맞춰 실천하기 쉬운 다음 단계를 제안해요.</p><textarea id="helpOutput" readonly></textarea><div class="modal-actions"><button class="secondary" id="copyAdvice">복사하기</button><button class="primary" id="closeHelp">닫기</button></div></div></div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const KEY = 'one-step-planner-v2';
  const labels = {study:'공부',work:'업무',personal:'개인',health:'건강',etc:'기타'};
  const icons = {study:'📚',work:'💼',personal:'🏡',health:'🌿',etc:'✨'};
  let tasks = [];
  let filter = 'all';
  let sortPriority = true;
  let editingId = null;
  let toastTimer;
  try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if(Array.isArray(saved)) tasks = saved.filter(t => t && typeof t.title === 'string' && t.id); } catch(e) { tasks = []; }
  const date = new Date();
  $('todayDate').textContent = new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(date);
  $('greeting').textContent = date.getHours() < 11 ? '상쾌한 아침이에요. 가장 중요한 일부터 가볍게 시작해 봐요.' : date.getHours() < 18 ? '지금 할 수 있는 작은 한 가지부터 차근차근 해봐요.' : '오늘 해낸 일도 충분히 의미 있어요. 남은 일은 무리하지 말고 살펴봐요.';
  function save(){ try { localStorage.setItem(KEY,JSON.stringify(tasks)); } catch(e) { toast('저장 공간이 부족해요. 일부 항목을 정리해 주세요.'); } }
  function toast(message){ const el=$('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2400); }
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function dateLabel(value){ if(!value)return ''; const d=new Date(value+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()} 마감`; }
  function render(){
    const total=tasks.length, done=tasks.filter(t=>t.done).length, left=total-done, pct=total?Math.round(done/total*100):0;
    $('percent').textContent=pct+'%'; $('ring').style.setProperty('--progress',pct+'%'); $('doneCount').textContent=done; $('leftCount').textContent=left;
    $('scoreText').textContent=total===0?'첫 번째 할 일을 추가해 보세요.':left===0?'모든 일을 해냈어요. 정말 잘했어요!':`할 일 ${left}개가 남아 있어요.`;
    const query=$('searchInput').value.trim().toLocaleLowerCase('ko');
    let shown=tasks.filter(t=>{
      const matchesFilter=filter==='all'||(filter==='active'&&!t.done)||(filter==='done'&&t.done)||t.category===filter;
      return matchesFilter && t.title.toLocaleLowerCase('ko').includes(query);
    });
    if(sortPriority) shown.sort((a,b)=>({high:0,normal:1,low:2}[a.priority]??1)-({high:0,normal:1,low:2}[b.priority]??1) || Number(a.done)-Number(b.done) || a.created-b.created);
    else shown.sort((a,b)=>Number(a.done)-Number(b.done)||b.created-a.created);
    $('listCount').textContent=shown.length;
    $('taskList').replaceChildren();
    if(!shown.length){
      const empty=document.createElement('div'); empty.className='empty';
      empty.innerHTML='<div class="emoji">🪴</div><strong>'+(tasks.length?'검색 결과가 없어요':'아직 등록한 할 일이 없어요')+'</strong><span>'+(tasks.length?'검색어나 필터를 바꿔 보세요.':'왼쪽에서 첫 번째 할 일을 추가해 보세요!')+'</span>';
      $('taskList').appendChild(empty);
    } else shown.forEach(t=>{
      const item=document.createElement('article'); item.className='task'+(t.done?' done':'');
      const check=document.createElement('input'); check.type='checkbox'; check.className='check'; check.checked=!!t.done; check.setAttribute('aria-label',t.title+' 완료'); check.addEventListener('change',()=>{t.done=check.checked;save();render();toast(t.done?'완료했어요! 잘했어요 🎉':'진행 중으로 바꿨어요.');});
      const content=document.createElement('div');
      const title=document.createElement('div');title.className='task-title';title.textContent=t.title;content.appendChild(title);
      const meta=document.createElement('div');meta.className='task-meta';
      const cat=document.createElement('span');cat.className='tag '+t.category;cat.textContent=(icons[t.category]||'✨')+' '+(labels[t.category]||'기타');meta.appendChild(cat);
      if(t.priority==='high'){const p=document.createElement('span');p.className='tag urgent';p.textContent='🔥 우선';meta.appendChild(p);}
      if(t.due){const d=document.createElement('span');d.className='due'+(!t.done&&t.due<new Date().toISOString().slice(0,10)?' late':'');d.textContent='◷ '+dateLabel(t.due);meta.appendChild(d);}
      content.appendChild(meta);
      const actions=document.createElement('div');actions.className='task-actions';
      const edit=document.createElement('button');edit.className='icon-btn';edit.type='button';edit.textContent='✎';edit.title='수정';edit.setAttribute('aria-label',t.title+' 수정');edit.addEventListener('click',()=>beginEdit(t.id));
      const del=document.createElement('button');del.className='icon-btn';del.type='button';del.textContent='×';del.title='삭제';del.setAttribute('aria-label',t.title+' 삭제');del.addEventListener('click',()=>{if(confirm('이 할 일을 삭제할까요?')){tasks=tasks.filter(x=>x.id!==t.id);save();render();toast('할 일을 삭제했어요.');}});
      actions.append(edit,del);item.append(check,content,actions);$('taskList').appendChild(item);
    });
    $('footerCount').textContent=total?`전체 ${total}개 중 ${done}개 완료`:'할 일을 추가하면 여기에 표시돼요.';
  }
  function resetForm(){editingId=null;$('taskForm').reset();$('formTitle').textContent='＋ 새 할 일 추가';$('submitBtn').innerHTML='할 일 추가하기 <span>→</span>';$('cancelEdit').style.display='none';}
  function beginEdit(id){const t=tasks.find(x=>x.id===id);if(!t)return;editingId=id;$('taskInput').value=t.title;$('category').value=t.category||'etc';$('priority').value=t.priority||'normal';$('dueDate').value=t.due||'';$('formTitle').textContent='✎ 할 일 수정';$('submitBtn').textContent='변경 사항 저장';$('cancelEdit').style.display='block';$('taskInput').focus();window.scrollTo({top:0,behavior:'smooth'});}
  $('taskForm').addEventListener('submit',e=>{e.preventDefault();const title=$('taskInput').value.trim();if(!title){$('taskInput').focus();return;}if(editingId){const t=tasks.find(x=>x.id===editingId);if(t)Object.assign(t,{title,category:$('category').value,priority:$('priority').value,due:$('dueDate').value||''});toast('변경 사항을 저장했어요.');}else{tasks.push({id:(window.crypto && typeof window.crypto.randomUUID==='function' ? window.crypto.randomUUID() : String(Date.now())+'-'+Math.random().toString(36).slice(2)),title,category:$('category').value,priority:$('priority').value,due:$('dueDate').value||'',done:false,created:Date.now()});toast('새 할 일을 추가했어요!');}save();resetForm();render();});
  $('cancelEdit').addEventListener('click',resetForm);
  $('searchInput').addEventListener('input',render);
  $('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$('tabs').querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render();});
  $('sortBtn').addEventListener('click',()=>{sortPriority=!sortPriority;$('sortBtn').textContent=sortPriority?'우선순위순 ↕':'최근 등록순 ↕';render();});
  $('clearDone').addEventListener('click',()=>{const n=tasks.filter(t=>t.done).length;if(!n){toast('정리할 완료 항목이 없어요.');return;}if(confirm(`완료한 ${n}개 항목을 정리할까요?`)){tasks=tasks.filter(t=>!t.done);save();render();toast('완료 항목을 정리했어요.');}});
  function makeAdvice(){const total=tasks.length,done=tasks.filter(t=>t.done).length,remaining=tasks.filter(t=>!t.done);if(!total)return '아직 할 일이 없네요!\\n\\n1. 오늘 꼭 해야 하는 일 한 가지를 적어 보세요.\\n2. 그 일을 10~20분 안에 시작할 수 있는 작은 단계로 나눠 보세요.\\n3. 끝나면 완료 표시를 하고 잠깐 쉬어 가세요.';const high=remaining.filter(t=>t.priority==='high');const overdue=remaining.filter(t=>t.due&&t.due<new Date().toISOString().slice(0,10));let s=`현재 ${total}개 중 ${done}개를 완료했어요 (${Math.round(done/total*100)}%).\\n`;if(!remaining.length)return s+'\\n모든 일을 완료했어요! 오늘의 성취를 충분히 누려도 좋아요. 🎉';s+='\\n추천하는 다음 단계:\\n';if(overdue.length)s+=`• 마감일이 지난 일 ${overdue.length}개를 먼저 확인해 보세요.\\n`;if(high.length)s+=`• 우선순위가 높은 일: “${high[0].title}”부터 15분만 집중해 보세요.\\n`;else s+=`• 다음으로 “${remaining[0].title}”을 작은 단계 하나로 시작해 보세요.\\n`;s+='• 부담이 크다면 할 일을 더 작게 나누고, 한 번에 하나씩 처리하세요.\\n\\n참고: 이 코치는 현재 목록을 바탕으로 한 규칙 기반 도우미이며, 외부 AI 서비스에 연결되지는 않아요.';return s;}
  $('helpModal').querySelector('.modal');function openAdvice(){$('helpOutput').value=makeAdvice();$('helpModal').classList.add('open');}
  $('percent').addEventListener('click',openAdvice);
  $('ring').addEventListener('click',openAdvice);
  $('closeHelp').addEventListener('click',()=>$('helpModal').classList.remove('open'));
  $('helpModal').addEventListener('click',e=>{if(e.target===$('helpModal'))$('helpModal').classList.remove('open');});
  $('copyAdvice').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('helpOutput').value);toast('조언을 복사했어요.');}catch(e){$('helpOutput').select();document.execCommand('copy');toast('조언을 복사했어요.');}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('helpModal').classList.remove('open');});
  render();
})();
</script>
</body>
</html>
